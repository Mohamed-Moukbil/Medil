<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MEDIL — redirection…</title>
  <script>
    // GitHub Pages SPA fallback : convertit le chemin en hash-route.
    (function () {
      var path = window.location.pathname + window.location.search;
      if (path && path !== '/') {
        window.location.replace('/#' + path);
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body></body>
</html>
