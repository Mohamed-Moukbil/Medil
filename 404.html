<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MEDIL — redirection…</title>
  <script>
    // GitHub Pages SPA fallback : conserve le chemin via ?p= pour que l'app le restaure.
    (function () {
      var path = window.location.pathname + window.location.search;
      if (path && path !== '/') {
        window.location.replace('/?p=' + encodeURIComponent(path));
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body></body>
</html>
